<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thinking Sand</title>
    <meta
      name="description"
      content="Thinking Sand is a machine intelligence company building software."
    />
    <meta property="og:title" content="Thinking Sand" />
    <meta
      property="og:description"
      content="Thinking Sand is a machine intelligence company building software."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thinkingsand.org" />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
      }

      body {
        font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        min-height: 100vh;
        max-width: 36rem;
        padding: 2rem 1.5rem 3rem;
      }

      h1 {
        margin: 0 0 1.15rem;
        font-size: 1.25rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }

      p {
        margin: 0;
        max-width: 22rem;
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 1.5;
      }

      @media (min-width: 640px) {
        main {
          padding: 4.5rem 3.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Thinking Sand</h1>
      <p>
        Thinking Sand is a machine intelligence company building software.
      </p>
    </main>
  </body>
</html>
